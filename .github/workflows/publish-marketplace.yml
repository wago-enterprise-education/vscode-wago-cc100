# GitHub Action to publish the VSIX to the VS Code Marketplace
# Triggers automatically after "Build VSIX" completes on a release event
# Gated by the 'release' environment (requires manual approval before publishing)
#
# To verify the PAT without publishing, use the "Verify Marketplace PAT" workflow.
#
# Prerequisites:
# - Add secret VSCE_PAT (VS Code Marketplace Personal Access Token) under
#   Settings → Secrets and variables → Actions

name: Publish to VS Code Marketplace

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows: ["Build VSIX", "Create GitHub Release"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: true
    # Only run when the triggering workflow succeeded AND was a release-related event
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'release' ||
       github.event.workflow_run.name == 'Create GitHub Release')

    steps:
      - name: Download VSIX from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine the release tag based on the triggering workflow
          # For release-triggered Build VSIX: head_branch is the tag directly
          # For PR-triggered Create GitHub Release: head_branch is release/vX.Y.Z
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [[ "$BRANCH" == release/v* ]]; then
            TAG="v${BRANCH#release/v}"
          elif [[ "$BRANCH" == v* ]]; then
            TAG="$BRANCH"
          else
            echo "Error: Cannot determine release tag from branch: $BRANCH"
            exit 1
          fi
          echo "Downloading VSIX from release: $TAG"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.vsix"

      - name: Find VSIX file
        id: find-vsix
        run: |
          VSIX_FILE=$(find . -name "*.vsix" -maxdepth 1 | head -1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No VSIX file found in release assets"
            exit 1
          fi
          echo "vsix-file=$VSIX_FILE" >> $GITHUB_OUTPUT
          echo "Found VSIX file: $VSIX_FILE"

      - name: Install VSCE
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --packagePath ${{ steps.find-vsix.outputs.vsix-file }}
